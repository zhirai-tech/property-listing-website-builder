<body>
  <!-- 登录 -->
  <section id="login-view" class="login-wrap">
    <form id="login-form" class="login-card">
      <h1>轻量化房源管理</h1>
      <p class="muted brand-line">
        <span>一次录入房源信息，一键生成可分享的展示页。</span>
        <span class="help-slot" data-help="登录后可以管理房源、照片、提醒，并发布可分享的公开页面。"></span>
      </p>
      <label class="field">
        <span>管理口令</span>
        <input type="password" id="login-password" autocomplete="current-password" required autofocus>
      </label>
      <p id="login-error" class="error hidden"></p>
      <button type="submit" class="btn primary block">登录</button>
      <p class="brand-line">
        <span class="help-slot" data-help="管理口令由服务端环境变量 ADMIN_PASSWORD 配置，不在界面里修改。"></span>
      </p>
      <p class="brand-line">
        <a href="https://zhirai.cloud" target="_blank" rel="noopener noreferrer">Powered by 智睿</a>
        <span>·</span>把想法变成现实
      </p>
    </form>
  </section>

  <!-- 主界面：手机用「顶部栏 + 底部标签栏」，桌面用左侧栏 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-title">
        <img class="brand-mark" src="/brand/64x64.png" width="28" height="28" alt="智睿">
        <strong data-i18n="房源管理">房源管理</strong>
        <span class="muted small" id="brand-workspace"></span>
      </div>
      <button id="logout" class="btn ghost small" type="button" data-i18n="退出登录">退出登录</button>
    </header>

    <aside class="sidebar">
      <div class="brand">
        <strong data-i18n="房源管理">房源管理</strong>
        <span class="muted small" id="brand-workspace-side"></span>
