<body>
  <!-- 未登录：注册 / 登录 -->
  <div id="auth-view" class="auth">
    <div class="auth-card">
      <h1>AI 单网页生成平台</h1>
      <p class="muted brand-line">

        <span>生成、预览、下载，自己部署</span>

        <span class="help-slot" data-help="免费用户可创建 1 个项目、使用 500,000 Token、修改 1 次；导出的网页可自行部署。升级套餐可获得更多额度与在线托管。"></span>

      </p>

      <div class="tabs" id="auth-tabs">
        <button type="button" data-mode="login" class="on">登录</button>
        <button type="button" data-mode="register">注册</button>
      </div>

      <form id="auth-form" novalidate>
        <label class="field">
          <span>邮箱</span>
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label class="field" id="name-field" hidden>
          <span>昵称</span>
          <input type="text" name="displayName" autocomplete="nickname" maxlength="60">
        </label>
        <label class="field">
          <span>口令 <span class="help-slot" data-help="至少 8 位。这个口令只用于登录本平台。"></span></span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <div id="auth-error" class="alert error" hidden></div>
        <button type="submit" class="btn primary block" id="auth-submit">登录</button>
      </form>
    </div>
  </div>

  <!-- 已登录：主界面 -->
  <div id="app-view" hidden>
    <header class="topbar">
      <span class="brand">
          <img class="brand-mark" src="/brand/64x64.png" width="28" height="28" alt="智睿">
          <strong>AI 单网页生成平台</strong>
        </span>
      <div class="row">
        <span class="muted small" id="who"></span>
        <button type="button" class="btn ghost small" id="logout">退出</button>
      </div>
    </header>

    <main id="main">
      <!-- 额度条 -->
      <section class="card" id="quota-card"></section>

      <!-- 项目列表 -->
      <section id="list-section">
        <div class="row spread mb">
          <h2>我的项目</h2>
          <button type="button" class="btn primary small" id="new-project">+ 新建项目</button>
        </div>
        <div id="new-project-form" class="card" hidden></div>
        <div class="row spread mb" id="trash-bar">
          <span></span>
          <button type="button" class="btn ghost small" id="open-trash">回收站</button>
          <button type="button" class="btn ghost small" id="open-gallery">看看能生成什么</button>
        </div>
        <div id="project-list"></div>
      </section>

      <!-- 项目编辑 -->
      <section id="editor-section" hidden>
        <div class="row spread mb">
          <button type="button" class="btn ghost small" id="back-to-list">← 返回项目列表</button>
          <span class="muted small" id="editor-status"></span>
        </div>
        <div id="editor"></div>
      </section>
    </main>

    <footer class="footer">
        <p class="brand-line">
          <a href="https://zhirai.cloud" target="_blank" rel="noopener noreferrer">Powered by 智睿</a>
          <span>·</span>把想法变成现实
        </p>
        <p class="brand-line muted small">
          <a href="https://zhirai.cloud" target="_blank" rel="noopener noreferrer">https://zhirai.cloud</a>
        </p>
        <p class="brand-line muted small">© 2026 智睿科技 保留所有权利。</p>
      </footer>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
